<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Processo {{ pid }}</title>
</head>
<body>
    <h1>Processo: {{ pid }}</h1>
    <h2>Relógio de Lamport Atual: <span id="clock" style="font-size: 24px; font-weight: bold; color: blue;">0</span></h2>
    
    <hr>

    <h3>Enviar Mensagem</h3>
    <select id="target">
        {% for dest in destinations %}
            <option value="{{ dest }}">{{ dest }}</option>
        {% endfor %}
    </select>
    <input type="text" id="text" placeholder="Mensagem string...">
    <button onclick="enviar()">Enviar</button>

    <hr>

    <h3>Histórico de Eventos</h3>
    <table border="1" cellpadding="5" cellspacing="0">
        <thead>
            <tr style="background-color: #eee;">
                <th>Hora</th>
                <th>Relógio</th>
                <th>Ação</th>
                <th>Detalhes</th>
            </tr>
        </thead>
        <tbody id="logs">
            </tbody>
    </table>

    <script>
        function enviar() {
            const target = document.getElementById('target').value;
            const text = document.getElementById('text').value;
            if(!text) return;

            fetch('/send', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ target: target, text: text })
            });
            document.getElementById('text').value = '';
        }

        const eventSource = new EventSource('/stream');
        eventSource.onmessage = function(event) {
            const data = JSON.parse(event.data);
            
            document.getElementById('clock').innerText = data.clock;
            
            const tbody = document.getElementById('logs');
            tbody.innerHTML = '';
            data.logs.slice().reverse().forEach(log => {
                tbody.innerHTML += `
                    <tr>
                        <td>${log.time}</td>
                        <td align="center"><b>${log.clock}</b></td>
                        <td>${log.action}</td>
                        <td>${log.detail}</td>
                    </tr>
                `;
            });
        };
    </script>
</body>
</html>
