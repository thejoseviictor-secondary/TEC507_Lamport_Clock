<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Processo {{ pid }} - Relógio de Lamport</title>
    <script src="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socketio/4.0.1/socketio.js"></script>
</head>
<body class="bg-gray-100 font-sans">
    <div class="container mx-auto p-6 max-w-4xl">
        
        <div class="bg-white p-6 rounded-lg shadow-md mb-6 flex justify-between items-center border-l-8 border-blue-500">
            <div>
                <h1 class="text-3xl font-bold text-gray-800">Processo: <span class="text-blue-600">{{ pid }}</span></h1>
                <p class="text-sm text-gray-500">Sistemas Distribuídos Avançados</p>
            </div>
            <div class="text-center bg-blue-50 p-4 rounded-lg border border-blue-200">
                <span class="text-xs font-semibold text-blue-600 uppercase tracking-wider">Relógio de Lamport</span>
                <div id="clock-display" class="text-4xl font-extrabold text-blue-800">{{ clock }}</div>
            </div>
        </div>

        <div class="bg-white p-6 rounded-lg shadow-md mb-6">
            <h2 class="text-xl font-bold mb-4 text-gray-700">Enviar Nova Mensagem (Evento de Envio)</h2>
            <div class="flex flex-col md:flex-row gap-4">
                <select id="target-select" class="p-2 border rounded bg-gray-50 md:w-1/4">
                    {% for dest in destinations %}
                        <option value="{{ dest }}">Destino: {{ dest }}</option>
                    {% endfor %}
                </select>
                <input type="text" id="msg-input" placeholder="Digite sua mensagem string aqui..." class="p-2 border rounded flex-1">
                <button onclick="sendMessage()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded transition">
                    Enviar
                </button>
            </div>
        </div>

        <div class="bg-white p-6 rounded-lg shadow-md">
            <h2 class="text-xl font-bold mb-4 text-gray-700">Histórico de Eventos / Relógios</h2>
            <div class="overflow-x-auto">
                <table class="min-w-full bg-white">
                    <thead>
                        <tr class="w-full bg-gray-200 text-gray-600 uppercase text-sm leading-normal">
                            <th class="py-3 px-6 text-left">Hora</th>
                            <th class="py-3 px-6 text-center">Relógio L.</th>
                            <th class="py-3 px-6 text-left">Ação</th>
                            <th class="py-3 px-6 text-left">Detalhes</th>
                        </tr>
                    </thead>
                    <tbody id="log-table" class="text-gray-600 text-sm font-light">
                        {% for log in logs[::-1] %}
                        <tr class="border-b border-gray-200 hover:bg-gray-100">
                            <td class="py-3 px-6 text-left">{{ log.time }}</td>
                            <td class="py-3 px-6 text-center font-bold text-blue-600">{{ log.clock }}</td>
                            <td class="py-3 px-6 text-left">
                                <span class="px-2 py-1 rounded text-xs font-bold {% if log.action=='ENVIADO' %}bg-green-100 text-green-800{% elif log.action=='RECEBIDO' %}bg-yellow-100 text-yellow-800{% else %}bg-red-100 text-red-800{% endif %}">
                                    {{ log.action }}
                                </span>
                            </td>
                            <td class="py-3 px-6 text-left">{{ log.detail }}</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const socket = io();

        function sendMessage() {
            const target = document.getElementById('target-select').value;
            const text = document.getElementById('msg-input').value;
            if(!text) return;
            
            socket.emit('send_message', { target: target, text: text });
            document.getElementById('msg-input').value = '';
        }

        socket.on('update', function(data) {
            document.getElementById('clock-display').innerText = data.clock;
            
            const tbody = document.getElementById('log-table');
            tbody.innerHTML = '';
            
            data.logs.slice().reverse().forEach(log => {
                let badgeClass = "bg-red-100 text-red-800";
                if(log.action === 'ENVIADO') badgeClass = "bg-green-100 text-green-800";
                if(log.action === 'RECEBIDO') badgeClass = "bg-yellow-100 text-yellow-800";

                tbody.innerHTML += `
                    <tr class="border-b border-gray-200 hover:bg-gray-100">
                        <td class="py-3 px-6 text-left">${log.time}</td>
                        <td class="py-3 px-6 text-center font-bold text-blue-600">${log.clock}</td>
                        <td class="py-3 px-6 text-left">
                            <span class="px-2 py-1 rounded text-xs font-bold ${badgeClass}">${log.action}</span>
                        </td>
                        <td class="py-3 px-6 text-left">${log.detail}</td>
                    </tr>
                `;
            });
        });
    </script>
</body>
</html>
